<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>asset</title>
		<style>
			:root {
				color-scheme: light;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #eef0f2;
			}
			body {
				font:
					12px/1.45 ui-monospace,
					"SF Mono",
					Menlo,
					monospace;
				color: #22262b;
			}
			/* The cursor says what a left drag will do before it is pressed. `default` is the floor, not
         a state: every view pans with a left drag, so the resting cursor is the open hand, and it
         closes while a pan runs. No handler writes `canvas.style.cursor`: the default rule and the
         two classes are the whole cursor contract. */
			canvas {
				display: block;
				cursor: default;
			}
			body.pan-ready canvas {
				cursor: grab;
			}
			body.pan-dragging canvas {
				cursor: grabbing;
			}

			#hud {
				position: fixed;
				top: 16px;
				left: 16px;
				padding: 12px 14px;
				background: rgb(255 255 255 / 0.82);
				border: 1px solid #d5d9de;
				border-radius: 8px;
				backdrop-filter: blur(6px);
				pointer-events: none;
				min-width: 190px;
			}
			#hud h1 {
				margin: 0 0 8px;
				font-size: 12px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: #6a7480;
			}
			#hud dl {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 2px 12px;
				margin: 0;
			}
			#hud dt {
				color: #6a7480;
			}
			#hud dd {
				margin: 0;
				text-align: right;
				font-variant-numeric: tabular-nums;
			}

			#views {
				position: fixed;
				bottom: 16px;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 6px;
				padding: 6px;
				background: rgb(255 255 255 / 0.82);
				border: 1px solid #d5d9de;
				border-radius: 8px;
				backdrop-filter: blur(6px);
			}
			/* The asset picker is a button in a select: same type, padding, radius, border colour and
         text colour as the buttons beside it. Its width is capped at the widest panel the sheet
         already draws, so a long candidate name cannot stretch the bar across the viewport. */
			#views select {
				font: inherit;
				max-width: 380px;
				padding: 5px 10px;
				border: 1px solid #d5d9de;
				border-radius: 5px;
				background: transparent;
				color: #22262b;
				cursor: pointer;
			}
			#views select:hover {
				background: #e7eaee;
			}
			#views button {
				font: inherit;
				padding: 5px 10px;
				border: 1px solid transparent;
				border-radius: 5px;
				background: transparent;
				color: #22262b;
				cursor: pointer;
			}
			#views button:hover {
				background: #e7eaee;
			}
			#views button[aria-pressed="true"] {
				background: #22262b;
				color: #fff;
			}
			#views .sep {
				width: 1px;
				align-self: stretch;
				background: #d5d9de;
				margin: 2px 3px;
			}

			/* The failure box. It must survive a screenshot and be unmissable, so it is a dark plate on
         the pale page rather than a line of text that could be mistaken for the HUD. */
			#error {
				position: fixed;
				inset: 24px auto auto 24px;
				z-index: 100;
				max-width: 70ch;
				margin: 0;
				padding: 16px 18px;
				background: #2a0d0d;
				color: #ffd7d7;
				border: 1px solid #7a2a2a;
				border-radius: 8px;
				font:
					12px/1.5 ui-monospace,
					monospace;
				white-space: pre-wrap;
			}
			#error[hidden] {
				display: none;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "/vendor/three/build/three.module.js",
					"three/addons/": "/vendor/three/addons/"
				}
			}
		</script>
	</head>
	<body>
		<div id="hud">
			<h1>asset</h1>
			<dl>
				<dt>view</dt>
				<dd id="hud-view">—</dd>
				<dt>tris</dt>
				<dd id="hud-tris">—</dd>
				<dt>meshes</dt>
				<dd id="hud-meshes">—</dd>
				<dt>draws</dt>
				<dd id="hud-draws">—</dd>
				<dt>size</dt>
				<dd id="hud-size">—</dd>
				<dt>zoom</dt>
				<dd id="hud-zoom">—</dd>
			</dl>
		</div>

		<div id="views"></div>

		<pre id="error" hidden></pre>

		<script type="module" src="./main.js"></script>
	</body>
</html>
