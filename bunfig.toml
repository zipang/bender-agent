[fmt]
jsdoc = true
trailingComma = "none"
# `broken.ts` is a fixture with a deliberate syntax error: the catalogue, the server and the error box
# must be tested against a module that does not parse. The formatter parses every file it reads, so it
# reports the error and exits non-zero; the file is excluded, not repaired.
ignorePatterns = ["tools/scene-viewer/fixtures/broken.ts"]
